plugins {
    id "com.android.library"
}

android {
    namespace "com.aprz.qbditracer"
    compileSdk 35

    defaultConfig {
        minSdk 24
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -fno-exceptions -fno-rtti"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildFeatures {
        prefab true
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "com.bytedance.android:shadowhook:2.0.1"
}

tasks.register("copyTracerDebug", Copy) {
    dependsOn "assembleDebug"
    from("$buildDir/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib/arm64-v8a")
    into("$rootDir/out/arm64-v8a")
    include("libqbdi_tracer.so")
}
