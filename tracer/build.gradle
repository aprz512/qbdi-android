plugins {
    id "com.android.library"
}

android {
    namespace "com.aprz.qbditracer"
    compileSdk 35

    defaultConfig {
        minSdk 24
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -fno-exceptions -fno-rtti"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildFeatures {
        prefab false
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }
}

def tracerIdentitySnapshot = "$buildDir/qtrace-source-identity.json"
def tracerIdentityScript = "$rootDir/scripts/tracer_build_identity.py"

tasks.register("captureTracerBuildIdentity", Exec) {
    commandLine "python3", tracerIdentityScript, "capture", "--repository", "$rootDir",
            "--snapshot", tracerIdentitySnapshot
}

tasks.named("preBuild").configure {
    dependsOn "captureTracerBuildIdentity"
}

tasks.register("copyTracerDebug", Copy) {
    dependsOn "assembleDebug"
    from("$buildDir/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib/arm64-v8a")
    into("$rootDir/out/arm64-v8a")
    include("libqbdi_tracer.so", "libshadowhook_nothing.so")
    outputs.upToDateWhen { false }
    doLast {
        exec {
            commandLine "python3", tracerIdentityScript, "publish", "--repository", "$rootDir",
                    "--snapshot", tracerIdentitySnapshot,
                    "--tracer", "$rootDir/out/arm64-v8a/libqbdi_tracer.so",
                    "--companion", "$rootDir/out/arm64-v8a/libshadowhook_nothing.so",
                    "--output", "$rootDir/out/arm64-v8a/build-identity.json"
        }
    }
}
