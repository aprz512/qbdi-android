plugins {
    id "com.android.application" version "8.5.2" apply false
    id "com.android.library" version "8.5.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

def nativeHostBuildDir = layout.buildDirectory.dir("native-host-tests")
def nativeHostCmakeBin = {
    def androidHome = System.getenv("ANDROID_HOME")
    if (!androidHome) {
        throw new GradleException(
                "nativeHostTest requires ANDROID_HOME to locate Android SDK CMake 3.22.1.")
    }

    def cmakeBin = file("${androidHome}/cmake/3.22.1/bin")
    if (!cmakeBin.isDirectory()) {
        throw new GradleException(
                "nativeHostTest requires Android SDK CMake 3.22.1 at ${cmakeBin}.")
    }

    return cmakeBin
}
def nativeHostCmakePath = {
    nativeHostCmakeBin().absolutePath + File.pathSeparator + (System.getenv("PATH") ?: "")
}
def nativeHostTool = { name ->
    def tool = new File(nativeHostCmakeBin(), name)
    if (!tool.canExecute()) {
        throw new GradleException("nativeHostTest requires executable ${tool}.")
    }

    return tool.absolutePath
}

tasks.register("configureNativeHostTests", Exec) {
    environment "PATH", nativeHostCmakePath()
    commandLine "cmake", "-S", "tracer/src/test/cpp", "-B", nativeHostBuildDir.get().asFile
    executable nativeHostTool("cmake")
}

tasks.register("buildNativeHostTests", Exec) {
    dependsOn "configureNativeHostTests"
    environment "PATH", nativeHostCmakePath()
    commandLine "cmake", "--build", nativeHostBuildDir.get().asFile, "--parallel", "2"
    executable nativeHostTool("cmake")
}

tasks.register("nativeHostTest", Exec) {
    dependsOn "buildNativeHostTests"
    environment "PATH", nativeHostCmakePath()
    commandLine "ctest", "--test-dir", nativeHostBuildDir.get().asFile,
            "--output-on-failure"
    executable nativeHostTool("ctest")
}
