[package]
name = "qtrace-provider-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lz4_flex = { version = "0.11", features = ["frame"] }
qtrace-provider = { path = "../crates/qtrace-provider" }
qtrace-store = { path = "../crates/qtrace-store" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "qtrb"
path = "fuzz_targets/qtrb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flight"
path = "fuzz_targets/flight.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_manifest"
path = "fuzz_targets/cache_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_report"
path = "fuzz_targets/session_report.rs"
test = false
doc = false
bench = false

[[bin]]
name = "annotations"
path = "fuzz_targets/annotations.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
