[workspace]
resolver = "2"
members = [
  "crates/qtrace-provider",
  "crates/qtrace-store",
  "crates/qtrace-analysis",
  "crates/qtrace-service",
  "src-tauri",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
proptest = "1"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash32"] }
